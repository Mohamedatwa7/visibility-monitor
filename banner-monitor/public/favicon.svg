<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Samsung Visibility Monitor mark: an eye (watching) whose pupil is a
       radar blip — filled shapes only, so it stays legible at 16px. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E4FE3"/>
      <stop offset="1" stop-color="#0D1C74"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>
  <path d="M11 32 C18.5 20.5 45.5 20.5 53 32 C45.5 43.5 18.5 43.5 11 32 Z" fill="#FFFFFF"/>
  <circle cx="32" cy="32" r="8.5" fill="#0D1C74"/>
  <circle cx="32" cy="32" r="3" fill="#6FA8FF"/>
</svg>
